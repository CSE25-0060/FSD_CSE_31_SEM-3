<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>With the help of javascript we can change the attributes of HTML elements</h1>
    <button type="button" id="btn1" onclick="document.getElementById('bulb1').src='Bulb ON.jpeg'">Click Here to Bulb ON</button>
    <img src="Bulb OFF.jpeg" style="width: 200px;" id="bulb1">
    <button type="button" id="btn2" onclick="document.getElementById('bulb1').src='Bulb OFF.jpeg'">Click Here to Bulb OFF</button>
    <script src="changeattribute.js"></script>
</body>
</html>
