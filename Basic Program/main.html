```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6fc;
            margin: 0;
            padding: 40px;
        }

        table {
            width: 80%;
            border-collapse: collapse;
            margin: auto;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        th, td {
            border: 2px solid #333;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #1f4e78;
            color: white;
            font-weight: bold;
        }

        tr:first-child th {
            font-size: 20px;
            padding: 15px;
        }

        tr:nth-child(2) th {
            background-color: #5b9bd5;
        }

        td {
            font-size: 16px;
        }

        td[rowspan] {
            font-weight: bold;
            background-color: #d9eaf7;
        }

        td[colspan] {
            background-color: #eef5fb;
            font-weight: bold;
        }

        tr:hover td {
            background-color: #e3f0ff;
        }
    </style>
</head>

<body>

    <center>
        <table>
            <tr>
                <th colspan="4">
                    ABES ENGINEERING COLLEGE (CSE DEPARTMENT)
                </th>
            </tr>

            <tr>
                <th colspan="3">TIME TABLE</th>
                <th>Wef; 27.07.2026</th>
            </tr>

            <tr>
                <th>Days</th>
                <th>Sec</th>
                <th>1 (8:30 - 9:30)</th>
                <th>2 (9:30 - 10:20)</th>
            </tr>

            <tr>
                <td rowspan="4">Monday</td>
                <td>B</td>
                <td colspan="2">APTITUDE</td>
            </tr>

            <tr>
                <td rowspan="2">C</td>
                <td colspan="2">DAA</td>
            </tr>

            <tr>
                <td colspan="2">DBMS</td>
            </tr>

            <tr>
                <td>A</td>
                <td>JAVA</td>
                <td>WT</td>
            </tr>
        </table>
    </center>

</body>
</html>
