<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Table</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <table border="2">
        <button onclick="showBill()">Show My Bill</button>
        <button type="reset" value="Reset">RESET</button>
        <tr>
            <th>Product Code</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Purchase</th>
            <th>Quantity</th>
        </tr>
        <tr>
            <td>601</td>
            <td>Biography of Prem Chand</td>
            <td>200</td>
            <td><input type="checkbox" name="purchase1" onclick="enableQty('purchase1','quantity1')"></td>
            <td><input type="number" name="quantity1" min="1" disabled></td>
        </tr>

        <tr>
            <td>602</td>
            <td>Harry Potter</td>
            <td>1600</td>
            <td><input type="checkbox" name="purchase2" onclick="enableQty('purchase2','quantity2')"></td>
            <td><input type="number" name="quantity2" min="1" disabled></td>
        </tr>

        <tr>
            <td>603</td>
            <td>Discovery of India</td>
            <td>550</td>
            <td><input type="checkbox" name="purchase3" onclick="enableQty('purchase3','quantity3')"></td>
            <td><input type="number" name="quantity3" min="1" disabled></td>
        </tr>

        <tr>
            <td>604</td>
            <td>Alif-Laila Story</td>
            <td>250</td>
            <td><input type="checkbox" name="purchase4" onclick="enableQty('purchase4','quantity4')"></td>
            <td><input type="number" name="quantity4" min="1" disabled></td>
        </tr>

        <tr>
            <td>605</td>
            <td>Amitabh Bachchan</td>
            <td>500</td>
            <td><input type="checkbox" name="purchase5" onclick="enableQty('purchase5','quantity5')"></td>
            <td><input type="number" name="quantity5" min="1" disabled></td>
        </tr>
        
    </table>
</body>
</html>
