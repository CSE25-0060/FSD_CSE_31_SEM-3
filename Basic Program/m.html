<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <form>
        <h1>Student Registration Form</h1>
        <label>First Name:</label>
        <input type="text" required><br><br>
        <label>Last Name:</label>
        <input type="text" required><br><br>
        <label>Father's Name:</label>
        <input type="text" required><br><br>
        <label>Mother's Name:</label>
        <input type="text" required><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" required><br><br>

        <label>Email:</label>
        <input type="email" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="male" required>  
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" required>
        <label for="female">Female</label><br><br>

        <label for="course">ChooseCourse:</label>
        <select required>
            <option value="">Select a course</option>
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
            <option value="mba">MBA</option>
            <option value="mca">MCA</option>
            <option value="bca">BCA</option>
        </select><br><br>

        <label>Hobbies:</label>
        <input type="checkbox" name="hobby1" value="reading">Singing
        <input type="checkbox" name="hobby2" value="sports">Dancing
        <input type="checkbox" name="hobby3" value="music">Reading books
        <input type="checkbox" name="hobby4" value="travel">Playing cricket<br><br>

        <label for="address">Address:</label>
        <textarea required></textarea><br><br>

        <label>Photo:</label>
        <input type="file" accept="image/*" required><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
